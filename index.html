<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Калькулятор Aveasy — внутренний расчёт</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Внутренняя страница калькулятора — компоновка «Пульт».
   Сценарий: менеджер за ноутбуком говорит с клиентом по телефону. Значит крупные цифры,
   ручки и итог одновременно на экране, ничего важного не прячем под клики. */

:root {
  --ink: #0a1828;
  --muted: #5a6b80;
  --line: rgba(10, 24, 40, .14);
  --line-soft: rgba(10, 24, 40, .07);
  --blue: #0055cc;
  --bg: #f0f3f8;
  --card: #ffffff;
  --good: #0a7d3f;
  --good-bg: #eefaf2;
  --warn: #7a4b00;
  --warn-bg: #fff6e0;
  --bad: #b3261e;
  --face: 'Manrope', 'Segoe UI', Roboto, Arial, sans-serif;
  --display: 'Unbounded', var(--face);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 15px/1.45 var(--face);
}

.avz-banner {
  background: #0a1828;
  color: #fff;
  font: 700 13px/1.4 var(--face);
  padding: 10px 16px;
  text-align: center;
  letter-spacing: .02em;
}
.avz-banner b { color: #00d4ff; }

/* --- Шапка: тарифы + вход в параметры модели --- */

.avz-top {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
}

.avz-tariffs {
  display: flex;
  gap: 10px;
  flex: 1 1 auto;
  flex-wrap: wrap;
}

.avz-tariff {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 160px;
  padding: 10px 14px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  font-family: var(--face);
  transition: border-color .12s, background .12s;
}
.avz-tariff:hover { border-color: rgba(0, 85, 204, .45); }
.avz-tariff-on {
  border-color: var(--blue);
  background: #eef4ff;
}
.avz-tariff-name { font: 800 16px/1.2 var(--display); }
.avz-tariff-price { font-size: 12.5px; color: var(--muted); }
.avz-tariff-on .avz-tariff-price { color: var(--blue); }

.avz-model-btn {
  padding: 10px 14px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  font: 600 13.5px var(--face);
  color: var(--ink);
  white-space: nowrap;
}
.avz-model-btn:hover { border-color: var(--blue); color: var(--blue); }
.avz-model-dot { color: var(--bad); font-size: 11px; vertical-align: 2px; }

/* --- Две колонки --- */

.avz-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  padding: 18px 20px;
  align-items: start;
}

@media (min-width: 1100px) {
  .avz-main { grid-template-columns: minmax(0, 1fr) 430px; }
}

/* --- Левая колонка: ручки --- */

.avz-controls {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.avz-field-group {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px 16px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px 14px;
}

.avz-group-title {
  grid-column: 1 / -1;
  font: 800 12px/1 var(--face);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}

.avz-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
  color: var(--muted);
}
.avz-field-wide { grid-column: 1 / -1; }

.avz-field input,
.avz-field select {
  font: 600 15px var(--face);
  color: var(--ink);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  min-height: 40px;
}
.avz-field input:focus,
.avz-field select:focus { outline: 2px solid rgba(0, 85, 204, .35); outline-offset: 1px; }

/* Пояснение под полем: что выбранный вариант значит на практике. */
.avz-hint {
  grid-column: 1 / -1;
  margin-top: -4px;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--muted);
}

.avz-toggle {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  cursor: pointer;
}
.avz-toggle input { width: 19px; height: 19px; accent-color: var(--blue); }

/* Строка товара: количество — главная ручка разговора, поэтому крупнее прочего */

#items-container { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }

.item-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.avz-qty {
  width: 120px;
  font: 800 23px var(--face);
  text-align: center;
  padding: 6px 8px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
}
.avz-qty:focus { outline: 2px solid rgba(0, 85, 204, .35); border-color: var(--blue); }

.item-row select {
  flex: 1 1 150px;
  min-width: 140px;
  font: 600 14px var(--face);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  min-height: 40px;
}

.avz-item-remove {
  border: none;
  background: none;
  color: var(--bad);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
}

.avz-add-item {
  grid-column: 1 / -1;
  justify-self: start;
  border: 1px dashed var(--line);
  background: none;
  color: var(--muted);
  border-radius: 9px;
  padding: 7px 12px;
  cursor: pointer;
  font: 600 13px var(--face);
}
.avz-add-item:hover { color: var(--blue); border-color: var(--blue); }

/* --- Правая колонка: итог, сверка, что входит --- */

.avz-summary {
  position: sticky;
  top: 88px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 12px;
  /* Влезает в первый экран и до прокрутки (когда над колонкой ещё виден баннер),
     и после — когда шапка прилипла. Что не поместилось, скроллится внутри колонки. */
  max-height: calc(100vh - 165px);
  overflow-y: auto;
}

.avz-cards {
  display: grid;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
}

.avz-card + .avz-card { border-top: 1px solid var(--line-soft); padding-top: 10px; }
.avz-card-label { font-size: 12.5px; color: var(--muted); }
.avz-card-value { font: 800 31px/1.1 var(--display); letter-spacing: -.01em; }
.avz-card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.avz-card-strong .avz-card-value { color: var(--blue); }

.avz-fit {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
}
.avz-fit-ok { border-color: rgba(10, 125, 63, .5); background: var(--good-bg); }
.avz-fit-over { border-color: rgba(180, 120, 0, .45); background: var(--warn-bg); }
.avz-fit-none { color: var(--muted); font-size: 13.5px; }
.avz-fit-head { font: 800 15px var(--face); }
.avz-fit-note { font-size: 13.5px; margin-top: 3px; }
.avz-fit-margin { font-size: 13px; color: var(--muted); margin-top: 6px; }
.avz-fit-low { color: var(--bad); font-weight: 700; }

.avz-warn {
  background: var(--warn-bg);
  border: 1px solid rgba(180, 120, 0, .35);
  color: var(--warn);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  display: grid;
  gap: 5px;
}

.avz-inc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px 14px;
}
.avz-inc-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font: 800 15px var(--face);
}
.avz-inc-copy {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 4px 9px;
  font: 600 12px var(--face);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
}
.avz-inc-copy:hover { color: var(--blue); border-color: var(--blue); }
.avz-inc-sub {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font: 800 11px var(--face);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 10px 0 4px;
}
.avz-inc-sub b { color: var(--ink); white-space: nowrap; }
.avz-inc-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.avz-inc-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13.5px;
  padding-left: 15px;
  position: relative;
}
.avz-inc-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--good);
  font-size: 12px;
}
.avz-inc-list b { white-space: nowrap; }
.avz-inc-points li::before { content: '•'; color: var(--blue); }

/* --- Нижняя секция: выгрузки и разбор --- */

.avz-bottom { padding: 0 20px 26px; }

.avz-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

.avz-btn {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 10px;
  padding: 9px 14px;
  font: 700 13.5px var(--face);
  cursor: pointer;
}
.avz-btn:hover { border-color: var(--blue); color: var(--blue); }
.avz-btn-main { background: var(--ink); color: #fff; border-color: var(--ink); }
.avz-btn-main:hover { background: #16304d; color: #fff; }
.avz-btn-client { background: var(--blue); color: #fff; border-color: var(--blue); }
.avz-btn-client:hover { color: #fff; opacity: .9; }

.avz-status {
  margin-bottom: 10px;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 13px;
  background: var(--good-bg);
  color: var(--good);
}
.avz-status-warn { background: var(--warn-bg); color: var(--warn); }

.avz-rows-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
}
.avz-rows-box > summary {
  cursor: pointer;
  font: 700 14px var(--face);
  color: var(--muted);
}
.avz-rows-box[open] > summary { color: var(--ink); margin-bottom: 10px; }

#avz-rows { overflow-x: auto; }

.avz-params {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 5px 16px;
  margin-bottom: 12px;
}
.avz-param {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
  border-bottom: 1px dotted var(--line-soft);
  padding: 3px 0;
}
.avz-param b { color: var(--ink); text-align: right; }

.avz-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 620px; }
.avz-table th {
  text-align: left;
  font: 800 11.5px var(--face);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
}
.avz-table td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.avz-num { text-align: right; white-space: nowrap; }
.avz-num-price { font-weight: 700; }
.avz-num-low { color: var(--bad); font-weight: 700; }
.avz-row-group td {
  font: 800 11.5px var(--face);
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 14px;
  border-bottom: none;
}
.avz-row-label { display: block; font-weight: 600; }
.avz-row-detail { display: block; font-size: 12px; color: var(--muted); }

/* --- Боковая панель «что если» --- */

.avz-model {
  position: fixed;
  right: 0;
  top: 0;
  height: 100vh;
  width: min(430px, 92vw);
  background: var(--card);
  border-left: 1px solid var(--line);
  box-shadow: -18px 0 40px rgba(10, 24, 40, .16);
  padding: 16px 18px 40px;
  overflow-y: auto;
  z-index: 40;
}
.avz-model[hidden] { display: none; }

.avz-model-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 17px;
}
.avz-model-close {
  border: none;
  background: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--muted);
  padding: 4px 6px;
}
.avz-model-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 10px; }
.avz-model-reset {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 9px;
  padding: 7px 12px;
  font: 600 13px var(--face);
  cursor: pointer;
  margin-bottom: 12px;
}
.avz-model-fields { display: grid; gap: 9px; }

.avz-mfield { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.avz-mfield-input { display: flex; align-items: center; gap: 7px; }
.avz-mfield-input input {
  flex: 1 1 auto;
  min-width: 0;
  font: 600 14px var(--face);
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
}
.avz-mfield-input i { font-style: normal; font-size: 12px; color: var(--muted); min-width: 58px; }
.avz-mfield-changed .avz-mfield-input input { border-color: var(--blue); background: #eef4ff; }
.avz-mfield-base { font-size: 11.5px; color: var(--blue); }

/* --- Печать --- */

@media print {
  .avz-banner, .avz-top, .avz-actions, .avz-model, .avz-status, .avz-add-item { display: none !important; }
  body { background: #fff; }
  .avz-main { grid-template-columns: 1fr; padding: 0; }
  .avz-summary { position: static; max-height: none; overflow: visible; }
  .avz-rows-box { border: none; padding: 0; }
  .avz-table { min-width: 0; }
}

</style>
</head>
<body>
<div class="avz-banner">Внутренний инструмент Aveasy — <b>себестоимость и маржа видны на этой странице</b>. Клиенту отправляйте выгрузку «Для клиента», а не ссылку.</div>

<header class="avz-top">
  <div class="avz-tariffs" id="avz-tariffs"></div>
  <button type="button" class="avz-model-btn" id="avz-model-toggle">
    Параметры модели <span class="avz-model-dot" hidden>●</span>
  </button>
</header>

<main class="avz-main">
  <form class="avz-controls" id="ave-form">
    <div class="avz-field-group">
      <div class="avz-group-title">Товар и объём</div>
      <div id="items-container"></div>
      <button type="button" class="avz-add-item" id="avz-add-item">+ ещё тип товара</button>
    </div>

    <div class="avz-field-group">
      <div class="avz-group-title">Масштаб</div>
      <label class="avz-field">Аккаунтов
        <input type="number" name="accounts" value="1" min="1" step="1">
      </label>
      <label class="avz-field">Регионов
        <input type="number" name="regions" value="1" min="1" step="1">
      </label>
      <label class="avz-field avz-field-wide">Как размещаем по регионам
        <select name="regionMode">
          <option value="single">Одно объявление на все регионы</option>
          <option value="repeat" selected>Одно объявление, публикуем в каждом регионе</option>
          <option value="distinct">Свои объявления под каждый регион</option>
        </select>
      </label>
    </div>

    <div class="avz-field-group">
      <div class="avz-group-title">Услуги</div>
      <label class="avz-field avz-field-wide">Как у клиента сейчас с данными о товарах?
        <select name="placementLevel" id="avz-placement"></select>
      </label>
      <small class="avz-hint" id="avz-placement-hint"></small>
      <label class="avz-field">Автоответчик
        <select name="autoresponder">
          <option value="none">Нет</option>
          <option value="basic" selected>Обычный</option>
          <option value="trainable">Обучаемый</option>
        </select>
      </label>
      <label class="avz-field">Аналитика
        <select name="analytics">
          <option value="basic" selected>Базовая</option>
          <option value="extended">Расширенная</option>
          <option value="crossCrm">Сквозная + CRM</option>
        </select>
      </label>
      <label class="avz-toggle"><input type="checkbox" name="promotionMgmt"><span>Управление продвижением</span></label>
      <label class="avz-toggle"><input type="checkbox" name="noMonthly"><span>Разовый проект — без ведения</span></label>
    </div>
  </form>

  <aside class="avz-summary" id="avz-summary"></aside>
</main>

<section class="avz-bottom">
  <div class="avz-actions" id="avz-actions">
    <button type="button" class="avz-btn avz-btn-main" data-act="png-internal">Скачать внутренний расчёт</button>
    <button type="button" class="avz-btn" data-act="copy-internal">Копировать картинку</button>
    <button type="button" class="avz-btn avz-btn-client" data-act="png-quote">Выгрузить для клиента</button>
    <button type="button" class="avz-btn" data-act="copy-quote">Копировать КП</button>
    <button type="button" class="avz-btn" data-act="print">Печать / PDF</button>
  </div>
  <div class="avz-status" id="avz-status" hidden></div>
  <details class="avz-rows-box">
    <summary>Разбор по строкам — себестоимость, цена, наценка</summary>
    <div id="avz-rows"></div>
  </details>
</section>

<aside class="avz-model" id="avz-model-panel" hidden></aside>

<script>
(() => {
  // config/pricing.config.js
  var config = {
    currency: "RUB",
    rates: {
      avitolog: 565,
      // 2026-07-03: +13% (расходы) — было 500
      analyst: 2260,
      // +13% — было 2000
      dev: 2260
      // +13% — было 2000
    },
    targetMargin: 0.7,
    // 2026-07-03: 0.6→0.7 (маржа подросла); с rates+13% и placement+20% даёт ~+20% цены клиенту
    marginFloor: 0.5,
    roundTo: 500,
    content: {
      // Себестоимость создания контента ₽/объявление по типу товара
      byType: {
        catalog: 28,
        // Каталожный / расходники (трубы, крепёж, бытхимия) — 2026-07-03 +13% (было 25)
        serial: 34,
        // Серийный по модели (электроника, бытовая техника) — +13% (было 30)
        unique: 56
        // Уникальный / штучный (квартиры, авто, б/у вещи) — +12% (было 50)
      },
      typeLabels: {
        catalog: "Каталожный / расходники",
        serial: "Серийный по модели",
        unique: "Уникальный / штучный"
      },
      typeExamples: {
        catalog: "трубы, крепёж, книги, расходники, автохимия",
        serial: "электроника, одежда, инструменты, запчасти",
        unique: "квартиры, авто, услуги, мебель, б/у"
      },
      // Примечание: manual↔unique, auto↔serial, strongAuto↔catalog (для category-reference)
      statusMultiplier: { own: 0, partial: 0.5, none: 1 }
    },
    // categoryAutomation ПЕРЕМЕЩЁН в config/category-reference.js (справочник для UI, движком не используется)
    // Placement: прямые клиентские цены (₽), не часы×ставка.
    // setup = разовая фикс-настройка; setupPerListing = разово за объявление.
    // Ежемесячная поддержка загрузки удалена (Pass 9): ведение существующих объявлений
    // покрыто «Ведением и оптимизацией»; добавление новых — отдельная услуга вне калькулятора.
    // label — короткое внутреннее имя (отчёты, разбор по строкам).

  function computeCost(inputs, config2) {
    const w = config2.work;

        hours: null,
        cost: contentCost,

    const totalListings = items.reduce((s, it) => s + it.listings, 0);
    const totalPublications = totalListings * pubMult;
    const pl = inputs.placementLevel;
    const P = config2.placement[pl];
    if (P) {
      if (P.setup !== 0) {
        const fixedPrice = P.setup;
        const cost = Math.round(fixedPrice / (1 + config2.targetMargin));
        lines.push({ key: "placement_setup", label: "Настройка размещения", phase: "setup", hours: null, cost, fixedPrice, qty: null, unit: null });

      }

    const ar = inputs.autoresponder;

    } else if (ar === "trainable") {

      lines.push({ key: "autoresponder_setup", label: "Настройка автоответчика", phase: "setup", role: w.autoresponder.trainable.role, hours: hSetup, cost: costSetup, qty: null, unit: null });
      const hMonthly = w.autoresponder.trainable.monthlyHours;
      const costMonthly = hMonthly * rates[w.autoresponder.trainable.role];
      lines.push({ key: "autoresponder", label: "Автоответчик", phase: "monthly", role: w.autoresponder.trainable.role, hours: hMonthly, cost: costMonthly, qty: null, unit: null });
    }
    const an = inputs.analytics;
    if (an === "basic") {
      const h = w.analytics.basic.monthlyHours;
      const cost = h * rates[w.analytics.basic.role];

    } else if (an === "crossCrm") {

      lines.push({ key: "analytics_setup", label: "Подключение сквозной аналитики/CRM", phase: "setup", role: w.analytics.crossCrm.role, hours: hSetup, cost: costSetup, qty: null, unit: null });
      const hMonthly = w.analytics.crossCrm.monthlyHours;

  // src/price.js
  function round(x, step) {
    if (!step || step <= 1) return Math.round(x);
    return Math.round(x / step) * step;
  }
  function computePrice(cost, config2) {
    const m = 1 + config2.targetMargin;
    const lines = cost.lines.map((l) => {
      let price;
      if (typeof l.fixedPrice === "number") {
        price = l.fixedPrice;
      } else if (l.qty && l.qty > 0) {
        const perUnit = Math.round(l.cost / l.qty * m);
        price = perUnit * l.qty;
      } else {
        price = round(l.cost * m, config2.roundTo);
      }
      return { key: l.key, label: l.label, phase: l.phase, price };
    });
    const sum = (phase) => lines.filter((l) => l.phase === phase).reduce((s, l) => s + l.price, 0);
    return { setup: sum("setup"), monthly: sum("monthly"), lines };
  }

  // src/guardrails.js
  function checkMarket(price, config2) {
    const setupCeiling = config2.market && config2.market.setupCeiling;
    return {

      setupOverCeiling: setupCeiling != null && price.setup > setupCeiling

  // src/engine.js
  function pct(price, cost) {
    return cost === 0 ? 0 : (price - cost) / cost;
  }
  function calculate(inputs, config2) {
    const cost = computeCost(inputs, config2);
    const price = computePrice(cost, config2);
    const flooredSetup = Math.max(price.setup, config2.setupMin);
    const setupMinApplied = flooredSetup > price.setup;
    const setupMinAdjustment = flooredSetup - price.setup;
    price.setup = flooredSetup;
    const noMonthly = !!inputs.noMonthly;
    const flooredMonthly = noMonthly ? 0 : Math.max(price.monthly, config2.minMonthly);
    const minMonthlyApplied = !noMonthly && flooredMonthly > price.monthly;
    const minMonthlyAdjustment = flooredMonthly - price.monthly;
    price.monthly = flooredMonthly;
    const margin = {
      setupPct: pct(price.setup, cost.setup),
      monthlyPct: pct(price.monthly, cost.monthly)
    };
    const guardrails = {
      setupMinApplied,
      setupMinAdjustment,
      minMonthlyApplied,
      minMonthlyAdjustment,
      ...checkMarket(price, config2)
    };
    return {
      inputs,
      cost,
      price,
      margin,
      guardrails
    };
  }

    const markupAtAnchor = costMonthly === 0 ? null : Math.round((anchorMonthly - costMonthly) / costMonthly * 100);
    const marginAtAnchor = anchorMonthly === 0 ? 0 : Math.round((anchorMonthly - costMonthly) / anchorMonthly * 100);
    const delta = calcMonthly - anchorMonthly;
    const within = delta <= 0;
    const note = within ? `Расчёт укладывается в тариф: ${fmtRub(calcMonthly)} при обещанных ${fmtRub(anchorMonthly)}.` : `Расчёт выше тарифа на ${fmtRub(delta)} — цена индивидуальная.`;
    return {
      label: tariff.label,
      anchorMonthly,
      anchorLabel: tariff.anchor.label,
      calcMonthly,
      delta,
      within,
      costMonthly,

          h += text(ctx, note, x, y + h, { weight: 500, size: 13.5, color: T.muted, width: w }, draw) + 8;
        }
        return h;
      },
      spacer(10),
      (ctx, x, y, w, draw) => rule(ctx, x, y, w, draw),
      (ctx, x, y, w, draw) => text(
        ctx,
        `Первый шаг — бесплатный анализ ниши и стратегия. ${site}`,
        x,
        y + 10,
        { weight: 600, size: 14, color: T.ink, width: w },

  }
  function canvasToBlob(canvas) {
    return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  }
  async function downloadCanvas(canvas, filename) {
    const blob = await canvasToBlob(canvas);
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1e4);
  }
  async function copyCanvas(canvas) {
    if (!navigator.clipboard || typeof ClipboardItem === "undefined") return false;
    try {
      const blob = await canvasToBlob(canvas);
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);

    }
  }
  function fileName(prefix, date = /* @__PURE__ */ new Date()) {
    const two = (n) => String(n).padStart(2, "0");
    return `${prefix}-${date.getFullYear()}-${two(date.getMonth() + 1)}-${two(date.getDate())}.png`;
  }

  // web/internal-page/app.js
  function mountApp({ root, config: config2, baseConfig: baseConfig2 }) {
    const form = root.querySelector("#ave-form");
    if (!form) return null;
    function currentResult() {
      return calculate(readInputs(form), config2);
    }
    const controls = mountControls({ root, config: config2, onChange: () => refresh() });
    const summary = mountSummary({ root });
    const rows = mountRows({ root });
    const modelPanel = mountModelPanel({ root, config: config2, baseConfig: baseConfig2, onApply: () => refresh() });
    let last = { report: null, quote: null, includes: null, fit: null };
    function currentTariff() {
      const key = controls.activeTariffKey();
      return key ? config2.presets[key] : null;
    }
    function refresh() {
      const result = currentResult();
      const tariff = currentTariff();
      last = {
        report: buildInternalReport(result, config2, { baseConfig: baseConfig2 }),
        quote: buildQuoteReport(result, config2),
        includes: buildIncludes(result, config2, tariff),
        fit: buildTariffFit(result, tariff, config2)
      };
      summary.render({
        report: last.report,
        fit: last.fit,
        includes: last.includes,
        tariffLabel: tariff ? tariff.label : null
      });
      rows.render(last.report);
      modelPanel.render(last.report);
    }
    const statusBox = root.querySelector("#avz-status");
    function status(message, kind = "ok") {
      statusBox.textContent = message;
      statusBox.className = `avz-status avz-status-${kind}`;
      statusBox.hidden = false;
      clearTimeout(status.timer);
      status.timer = setTimeout(() => {
        statusBox.hidden = true;
      }, 4e3);
    }
    function internalPng() {
      const tariff = currentTariff();
      return renderInternalPng(last.report, { tariffLabel: tariff ? tariff.label : null });
    }
    root.addEventListener("click", async (e) => {
      if (!e.target.closest('[data-act="copy-includes"]')) return;
      try {
        await navigator.clipboard.writeText(last.includes.text);
        status("Состав скопирован — вставьте в чат (Ctrl+V)");
      } catch (err) {
        status("Буфер недоступен в этом браузере", "warn");
        console.warn("Буфер недоступен", err);
      }
    });
    root.querySelector("#avz-actions").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const act = btn.getAttribute("data-act");
      if (act === "print") {
        window.print();
        return;
      }
      const isInternal = act.endsWith("internal");
      const canvas = isInternal ? internalPng() : renderQuotePng(last.quote);
      if (act.startsWith("copy")) {
        const ok = await copyCanvas(canvas);
        status(
          ok ? "Картинка в буфере — вставьте в чат (Ctrl+V)" : "Буфер недоступен — сохраните файлом",
          ok ? "ok" : "warn"
        );
        return;
      }
      await downloadCanvas(canvas, fileName(isInternal ? "aveasy-vnutrenniy-raschet" : "aveasy-kp"));
      status(isInternal ? "Внутренний расчёт сохранён картинкой" : "Предложение для клиента сохранено картинкой");
    });
    controls.applyTariff("start");
    const api = {
      currentResult,
      currentTariff,
      refresh,
      report: () => last.report,
      quote: () => last.quote,
      includes: () => last.includes,
      fit: () => last.fit,
      internalPng,
      quotePng: () => renderQuotePng(last.quote),
      config: config2,
      baseConfig: baseConfig2
    };
    window.AVZ_INT = api;
    return api;
  }

  // web/internal-page/entry.js
  var baseConfig = JSON.parse(JSON.stringify(config));
  function init() {
    mountApp({ root: document, config, baseConfig });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
